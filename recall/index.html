<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인출 학습">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>컴구 인출 학습</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --fg:#1F2328; --fg2:#57606A; --line:#DCDAD3;
  --accent:#0B5CAD; --accent-fg:#FFFFFF; --accent-soft:#E6EEF8;
  --easy:#00704F; --easy-soft:#E3F3EC; --trap:#B3401A; --trap-soft:#FBEAE3; --hook:#7A5200; --hook-soft:#FFF4D6;
  --hl:#FFE9A8; --hl-edge:#D9A400;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1D2024; --fg:#E6E8EB; --fg2:#A4ACB7; --line:#2E333A;
    --accent:#7DB3EC; --accent-fg:#10161D; --accent-soft:#1E2B3A;
    --easy:#5CC9A0; --easy-soft:#17291F; --trap:#F09A76; --trap-soft:#33211A; --hook:#E8C170; --hook-soft:#2C2616;
    --hl:#4A3D17; --hl-edge:#C9A24A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1D2024; --fg:#E6E8EB; --fg2:#A4ACB7; --line:#2E333A;
    --accent:#7DB3EC; --accent-fg:#10161D; --accent-soft:#1E2B3A;
    --easy:#5CC9A0; --easy-soft:#17291F; --trap:#F09A76; --trap-soft:#33211A; --hook:#E8C170; --hook-soft:#2C2616;
    --hl:#4A3D17; --hl-edge:#C9A24A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-ligatures:none;word-break:keep-all}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em}
sup,sub{font-size:.7em;line-height:0}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--sat) + 22px) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar b{font-size:18px}
.bar .btns{display:flex;gap:6px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:11px;min-height:38px;padding:0 11px;font-size:13px;color:var(--fg2)}
#rcTabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
#rcTabs::-webkit-scrollbar{display:none}
#rcTabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;color:var(--fg2)}
#rcTabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--trap);color:var(--bg);font-size:12px;font-weight:700;margin-left:2px}

main{max-width:760px;margin:0 auto;padding:12px 16px calc(var(--sab) + 40px)}
.chap h1{font-size:24px;margin:14px 0 4px;letter-spacing:-.01em}
.goal{color:var(--fg2);margin:0 0 6px;font-size:15px}
.prog{margin:0 0 10px;font-size:15px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.toc a{font-size:13px;color:var(--fg2);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--surface)}
.tip{font-size:14px;color:var(--fg2);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0 0 6px}
.empty{color:var(--fg2)}

.chunk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;scroll-margin-top:130px}
.ch-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.ch-n{flex:none;width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:2px}
.chunk h2{font-size:19px;margin:0;line-height:1.4}
.why{font-size:13px;color:var(--fg2);margin:2px 0 0}
.blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lab{font-size:13px;font-weight:700;color:var(--fg2);margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:30px;padding:0 9px;font-size:12px;color:var(--fg2);font-weight:500}
.mini:first-of-type{margin-left:auto}
.core ul{margin:0;padding-left:1.1em}
.core li{margin:.45em 0;line-height:1.7}
.hook{background:var(--hook-soft);border-top:0;border-radius:12px;padding:10px 12px}
.hook .lab{color:var(--hook)}
.hook p:last-child{margin:0}
.steps{margin:0;padding-left:0;list-style:none}
.steps li{margin:.35em 0;line-height:1.65}
.ex .exq,.fd .exq{font-weight:600;margin:0 0 6px}
.exa{margin:8px 0 0}
.fd{background:var(--accent-soft);border-top:0;border-radius:12px;padding:12px}

/* 가림 칸: 가리기 켜짐이면 탭하기 전까지 안 보인다 */
.cz{border-bottom:2px solid var(--hl-edge);padding:0 2px;border-radius:3px;cursor:pointer}
.hide .cz:not(.on){color:transparent;background:var(--hl);user-select:none;-webkit-user-select:none}
.hide .cz:not(.on) *{visibility:hidden}
.cz.demo{color:transparent;background:var(--hl)}

/* 떠올리기 카드 */
.card-q{position:relative;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;margin:10px 0;background:var(--bg)}
.card-q.is-o{border-left-color:var(--easy)}
.card-q.is-x{border-left-color:var(--trap)}
.cq-from{font-size:12px;color:var(--fg2);margin:0 0 4px}
.cq{margin:0 0 8px;font-weight:600}
.reveal{width:100%;min-height:44px;border-radius:10px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:15px}
.ca{border-top:1px solid var(--line);padding-top:8px}
.ans{margin:0;color:var(--easy);font-weight:700}
.whyl{margin:4px 0 0;font-size:15px;color:var(--fg2)}
.grade{display:flex;gap:8px;margin-top:10px}
.grade button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.grade button[data-g="x"]{color:var(--trap);border-color:var(--trap)}
.grade button[data-g="o"]{color:var(--easy);border-color:var(--easy)}
.mark{position:absolute;top:8px;right:10px;font-size:11px;font-weight:700;color:var(--fg2)}
.card-q.is-o .mark{color:var(--easy)}
.card-q.is-x .mark{color:var(--trap)}
.big{width:100%;min-height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;margin-top:10px}
.mix h2{margin:0}
.stage{flex:none;margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.is-recall .stage{background:var(--hl);color:var(--fg)}
.is-learn .cz{color:inherit!important;background:transparent!important;border-bottom:2px solid var(--hl-edge)}
.is-learn .cz *{visibility:visible!important}
.learnb p,.relearn p{margin:.55em 0;line-height:1.75}
.learnb p:first-of-type{margin-top:0}
.learnb{border-top:0;margin-top:10px;padding:14px 16px;background:var(--bg);border-radius:14px}
.relearn>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;list-style:none}
.relearn>summary::-webkit-details-marker{display:none}
.relearn>summary::before{content:"B8  "}
.relearn[open]>summary::before{content:"BE  "}
.go .note,.chunk .note{font-size:13px;color:var(--fg2);margin:8px 0 0}
.back{border-top:0;margin-top:8px}

/* 아이패드 Pro 11 (834 × 1194 pt): 세로 = 넓은 한 칸, 가로 = 왼쪽 덩어리 목록 + 본문 */
#rcSide{display:none}
@media (min-width:740px){
  body{font-size:18px}
  .top{padding:calc(var(--sat) + 14px) 28px 10px}
  .top-in{max-width:none}
  main{max-width:820px;padding:16px 28px calc(var(--sab) + 48px)}
  .chap h1{font-size:28px}
  .chunk{padding:22px 24px;border-radius:20px}
  .chunk h2{font-size:21px}
  .grade button{min-height:50px}
  .card-q{padding:14px 16px 14px 18px}
}
@media (min-width:1100px){
  .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1194px;margin:0 auto;padding:0 28px}
  main{max-width:none;padding:16px 0 calc(var(--sab) + 48px)}
  #rcSide{display:block;position:sticky;top:var(--side-top,118px);align-self:start;max-height:calc(100vh - var(--side-top,118px) - 16px);overflow:auto;padding:18px 0 24px}
  .chap .toc{display:none}
  .chunk{scroll-margin-top:120px}
}
#rcSide .s-h{font-size:13px;color:var(--fg2);margin:0 0 4px}
#rcSide .s-t{font-size:18px;font-weight:800;margin:0 0 4px}
#rcSide .s-p{font-size:14px;margin:0 0 12px}
#rcSide a{display:flex;gap:8px;align-items:baseline;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:15px;line-height:1.4}
#rcSide a:hover{background:var(--surface)}
#rcSide a .n{flex:none;color:var(--fg2);font-size:13px;min-width:18px}
#rcSide a .k{margin-left:auto;font-size:12px;color:var(--fg2)}
#rcSide a .k.done{color:var(--easy)}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="bar"><b>인출 학습</b><div class="btns"><button type="button" class="ghost" id="rcHide">가리기: 켜짐</button><button type="button" class="ghost" id="rcTheme">화면</button></div></div>
  <div id="rcTabs"></div>
</div></div>
<div class="layout"><aside id="rcSide"></aside><main id="rcView"></main></div>
<script>
/* 인출 학습 데이터: Ch1 */
(window.RC = window.RC || {}).ch1 = {
  title: "Ch1 · 컴퓨터 추상화와 기술",
  goal: "임베디드·캐시·프로세서 두 가지·성능 3요소 같은 한 줄 정의(T/F·빈칸)와 CPU 시간·MIPS·개선율·암달·전력 계산",
  chunks: [
    {
      id: "ch1-class",
      title: "컴퓨터 분류와 ISA",
      why: "기출 21-2, 26-1: 임베디드 정의 T/F. ISA·ABI 정의는 단답 단골",
      learn: [
        "<b>한 줄 요약</b>: 컴퓨터는 쓰임새에 따라 PC·서버·임베디드로 나뉜다. 소프트웨어와 하드웨어 사이에는 ISA라는 약속이 있다.",
        "<b>세 가지 분류</b>: 개인용 컴퓨터(PC)는 범용(general purpose), 즉 다양한 소프트웨어를 돌리는 컴퓨터라서 비용과 성능 사이의 균형이 중요하다(예 데스크톱, 노트북). 서버는 보통 네트워크를 통해 접근하며 대용량·고성능·고신뢰성(잘 멈추지 않음)이 필요하다. 임베디드 컴퓨터는 자동차·세탁기처럼 다른 기기 안에 들어가 미리 정해진 응용만 실행하고, 전력·성능·비용 제약이 엄격하다. [Ch1 p.3]",
        "<b>ISA와 컴퓨터 구조</b>: ISA(Instruction Set Architecture, 명령어 집합 구조)는 하드웨어와 가장 낮은 수준의 소프트웨어 사이의 추상 인터페이스로, 줄여서 아키텍처(architecture)라고도 한다. 어떤 명령어가 있고 레지스터가 몇 개인지 같은 약속이다. 추상화(abstraction)는 아래 계층의 세부를 감추고 위에는 사용법만 보여 주는 것이다. 컴퓨터 구조 = ISA + 조직(Machine Organization)이고, 조직은 그 약속을 실제로 만드는 쪽(프로세서·입출력 구성, 논리·회로·물리 설계)이다. [Ch1 p.9, 17]",
        "<b>ABI와 구현</b>: ABI(Application Binary Interface)는 ISA + OS(운영체제) 인터페이스다. ISA 중 사용자 프로그램이 쓰는 부분에 운영체제를 부르는 방식을 더한, 응용 프로그램이 기계어 수준에서 지킬 약속 전체다. 구현(Implementation)은 아키텍처를 따르는 실제 하드웨어이며, 같은 ISA에 구현은 여러 개일 수 있다. 그래서 칩이 달라도 ISA가 같으면 같은 프로그램이 돈다. [Ch1 p.17]",
        "<b>프로그램 아래 계층</b>: 응용 소프트웨어 → 시스템 소프트웨어(대표 = OS, 컴파일러) → 하드웨어 순서로 쌓여 있다. OS가 하는 일은 셋: 기본 입출력 처리, 저장 공간·메모리 할당, 여러 프로그램이 컴퓨터를 나눠 쓰도록 순서와 몫을 정하는 자원 공유·작업 스케줄링. 컴파일러는 C 같은 고급 언어 프로그램을 하드웨어가 실행하는 명령어로 번역한다. 고급 언어의 장점은 생산성(productivity)과 이식성(portability, 다른 컴퓨터에서도 다시 컴파일만 하면 씀)이다. [Ch1 p.13–14]",
        "비유: 운전자는 핸들·페달만 알면 차를 몬다. 핸들·페달이 ISA, 엔진·브레이크 장치가 그 아래 구현이다. 안 맞는 점: 컴퓨터에서는 아래 계층을 알면 더 빠른 프로그램을 쓸 수 있어서, 이 과목은 추상화 아래를 들여다본다. [Ch1 p.10]",
        "주의: 임베디드는 성능이 낮은 컴퓨터라는 뜻이 아니다. 「범용, 다양한 SW, 비용과 성능의 균형」은 PC 정의라 임베디드라고 하면 X. ABI를 ISA와 같다고 쓰면 X, 구현은 소프트웨어가 아닌 하드웨어다."
      ],
      core: [
        "PC = 범용, 다양한 SW, [[비용·성능 균형]] / 서버 = 보통 [[네트워크]]로 접근, 대용량·고성능·고신뢰 [Ch1 p.3]",
        "임베디드 = [[다른 기기 안]]에서 미리 정해진 응용 실행, [[전력·성능·비용]] 제약이 엄격 [Ch1 p.3]",
        "컴퓨터 구조 = [[ISA]] + 조직(Machine Organization) [Ch1 p.9]",
        "ISA = 하드웨어와 [[최하위 소프트웨어]] 사이의 추상 인터페이스 = 아키텍처 / ABI = ISA + [[OS 인터페이스]] / 구현 = 아키텍처를 따르는 [[하드웨어]] [Ch1 p.17]",
        "응용 SW → 시스템 SW(OS, 컴파일러) → HW. OS 역할 = [[입출력 처리]], 저장공간·메모리 할당, [[자원 공유·작업 스케줄링]] [Ch1 p.13]"
      ],
      cards: [
        { q: "O/X: 임베디드 컴퓨터는 범용으로 다양한 소프트웨어를 실행하며 비용과 성능의 균형이 가장 중요하다.", a: "[[X]]", why: "그건 [[PC]] 정의. 임베디드 = 다른 기기 안, 정해진 응용, 전력·성능·비용 제약 엄격 [Ch1 p.3]" },
        { q: "다른 기기 안에 들어가 미리 정해진 응용을 실행하고 제약이 엄격한 컴퓨터는?", a: "[[임베디드]] 컴퓨터", why: "제약 세 가지 = [[전력·성능·비용]] [Ch1 p.3]" },
        { q: "빈칸: 컴퓨터 구조 = (　　) + 조직(Machine Organization)", a: "[[ISA]](명령어 집합 구조)", why: "ISA = 하드웨어와 최하위 SW 사이의 추상 인터페이스 [Ch1 p.9, 17]" },
        { q: "ABI = ?", a: "ISA + [[OS 인터페이스]]", why: "Application Binary Interface. 사용자 부분 명령어에 OS 인터페이스를 더한 것 [Ch1 p.17]" },
        { q: "아키텍처(ISA)를 따르는 하드웨어를 무엇이라 하는가?", a: "[[구현]](Implementation)", why: "같은 ISA에 구현은 여러 개일 수 있다 [Ch1 p.17]" },
        { q: "고급 언어의 장점 두 가지는?", a: "[[생산성]], [[이식성]]", why: "productivity·portability. 컴파일러가 고급 언어를 명령어로 번역 [Ch1 p.13]" }
      ]
    },
    {
      id: "ch1-ideas",
      title: "8대 위대한 아이디어",
      why: "map 상: 나열·짝짓기 단답, 영어 이름도 함께",

        "주소 지정 4: 즉시값, 레지스터, [[베이스]](lw·sw·jalr), [[PC 상대]](beq·bne·jal) [Ch2 p.49]",
        "분기 목표 = PC + 오프셋 필드 × [[2]], 범위 [[−4096 ~ 4094]]바이트 [Ch2 p.47]",
        "스택은 [[아래로]] 자람, 레지스터 하나당 sp [[4]] (5개 저장 → addi sp, sp, -20) [Ch2 p.37–38]",
        "프로시저 6단계: 인자 배치 → [[제어 이동]] → 저장 공간 확보 → 작업 → 결과 배치 → [[복귀]] [Ch2 p.33]"
      ]
    },
    {
      title: "Ch3",
      lines: [
        "오버플로: + + + = −, − + − = +, + − − = −, − − + = +. [[부호 다른 덧셈]]·[[부호 같은 뺄셈]]은 없음 [Ch3 p.4–5]",
        "mul = [[하위]] 32비트, mulh(부호 × 부호)·[[mulhu]](무 × 무)·mulhsu(부호 × 무) = [[상위]] 32비트 [Ch3 p.13]",
        "부호 있는 나눗셈: 부호가 다르면 몫 음수, 나머지 부호 = [[피제수]] 부호(−7 ÷ 2 → 몫 [[−3]], 나머지 [[−1]]) [Ch3 p.19]",
        "단정도 1 · [[8]] · 23, bias [[127]] / 배정도 1 · 11 · [[52]], bias 1023 [Ch3 p.28]",
        "16비트 1 · [[5]] · 10, bias [[15]] (PDF 외 보충, 26-1 기출)",
        "값 = (−1)<sup>S</sup> × [[(1 + F)]] × 2<sup>(지수 칸 − bias)</sup>, −0.75 = [[0xBF400000]] [Ch3 p.28, 31]",
        "FP 덧셈 4단계: [[소수점 맞추기]] → 유효숫자 더하기 → 정규화·검사 → [[반올림]] [Ch3 p.32]",
        "FP 곱셈 5단계: 지수 더하기([[bias 한 번 빼기]]) → 유효숫자 곱 → 정규화·검사 → 반올림 → [[부호 결정]] [Ch3 p.35]"
      ]
    },
    {
      title: "Ch4",
      lines: [
        "구현 7개: [[lw, sw]], add, sub, and, or, [[beq]] / 프로세서 = [[데이터패스 + 제어]] [Ch4 p.3, 8]",
        "R형 [[0 0 1 0 0 0 10]] / lw [[1 1 1 1 0 0 00]] (ALUSrc · MemtoReg · RegWrite · MemRead · MemWrite · Branch · ALUOp) [Ch4 p.25]",
        "sw [[1 X 0 0 1 0 00]] / beq [[0 X 0 0 0 1 01]] (ld = lw, sd = sw)",
        "ALU 제어: [[0000]] AND, [[0001]] OR, [[0010]] add, 0110 sub [Ch4 p.18]",
        "PCSrc = [[Branch AND Zero]], opcode만으로 못 정하는 [[유일한]] 신호 [Ch4 p.25]",
        "rs1 [[19:15]], rs2 [[24:20]], rd [[11:7]], opcode [6:0] [Ch4 p.21]",
        "조합 = 출력이 [[입력만의 함수]], 상태 = [[저장]], 엣지 트리거 = [[클럭 엣지]]에서만 갱신 [Ch4 p.9–10]",
        "메모리 둘 = 한 사이클에 자원 [[한 번]]만 [Ch4 p.16]",
        "최장 경로 [[lw]]: 명령어 메모리 → 레지스터 파일 → ALU → [[데이터 메모리]] → 레지스터 파일 [Ch4 p.29]",
        "단일 사이클 = [[자주 생기는 경우를 빠르게]] 위반 → [[파이프라이닝]] [Ch4 p.29]"
      ]
    }
  ]
};
/* 인출 학습 화면. 데이터 = window.RC.ch1~ch4, window.RC.final (recall/data_*.js) */
(function () {
  var RC = window.RC || {};
  var CH = ["ch1", "ch2", "ch3", "ch4"].filter(function (k) { return RC[k]; });
  var KEY = "rc_v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var st = load(); st.c = st.c || {}; st.s = st.s || {}; if (st.hide === undefined) st.hide = true;
  var $ = function (id) { return document.getElementById(id); };
  var view = $("rcView");

  // [[말]] → 탭하면 보이는 가림 칸
  function cz(s) { return String(s || "").replace(/\[\[(.+?)\]\]/g, '<span class="cz" role="button" tabindex="0">$1</span>'); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // 모든 카드 목록 [{key, ch, chunk, card}]
  var ALL = [];
  CH.forEach(function (k) { (RC[k].chunks || []).forEach(function (u) { (u.cards || []).forEach(function (c, i) { ALL.push({ key: u.id + ":" + i, ch: k, chunk: u, card: c }); }); }); });
  function cardsOf(k) { return ALL.filter(function (x) { return x.ch === k; }); }
  function known(list) { return list.filter(function (x) { return st.c[x.key] === "o"; }).length; }
  function wrongs() { return ALL.filter(function (x) { return st.c[x.key] === "x"; }); }

  function cardHTML(x, label) {
    var s = st.c[x.key] || "";
    return '<div class="card-q ' + (s === "o" ? "is-o" : s === "x" ? "is-x" : "") + '" data-key="' + x.key + '">' +
      (label ? '<p class="cq-from">' + label + "</p>" : "") +
      '<p class="cq">' + cz(x.card.q).replace(/class="cz"/g, 'class="cz on"') + "</p>" +
      '<button type="button" class="reveal">답 떠올렸으면 보기</button>' +
      '<div class="ca" hidden><p class="ans">' + cz(x.card.a).replace(/class="cz"/g, 'class="cz on"') + "</p>" +
      (x.card.why ? '<p class="whyl">' + cz(x.card.why).replace(/class="cz"/g, 'class="cz on"') + "</p>" : "") +
      '<div class="grade"><button type="button" data-g="x">몰랐다</button><button type="button" data-g="o">알았다</button></div></div>' +
      '<span class="mark">' + (s === "o" ? "알았다" : s === "x" ? "다시 볼 카드" : "") + "</span></div>";
  }
  function stepsHTML(list) { return "<ol class=\"steps\">" + list.map(function (s) { return "<li>" + cz(s) + "</li>"; }).join("") + "</ol>"; }

  // 덩어리 두 단계: 배우기(설명·핵심·풀이 예 모두 보임) → 떠올리기(핵심 가림·빈칸 풀이·카드)
  function chunkHTML(u, n) {
    var learnStage = st.s[u.id] !== "r";
    var learn = (u.learn || []).map(function (p) { return "<p>" + p + "</p>"; }).join("");
    var h = '<section class="chunk ' + (learnStage ? "is-learn" : "is-recall") + '" id="u-' + u.id + '" data-u="' + u.id + '"><div class="ch-h"><span class="ch-n">' + n + "</span><div><h2>" + u.title + "</h2>" + (u.why ? '<p class="why">' + u.why + "</p>" : "") + '</div><span class="stage">' + (learnStage ? "1 배우기" : "2 떠올리기") + "</span></div>";
    if (learn) h += learnStage ? '<div class="blk learnb"><p class="lab">배우기 · 처음부터 읽기</p>' + learn + "</div>"
      : '<details class="blk relearn"><summary>배우기 설명 다시 읽기</summary>' + learn + "</details>";
    h += '<div class="blk core"><p class="lab">핵심 정리' + (learnStage ? " (외울 말에 밑줄)" : ' <button type="button" class="mini" data-act="show">다 보기</button><button type="button" class="mini" data-act="hide">다시 가리기</button>') + "</p><ul>" +
      (u.core || []).map(function (l) { return "<li>" + cz(l) + "</li>"; }).join("") + "</ul></div>";
    if (u.hook) h += '<div class="blk hook"><p class="lab">외우는 고리</p><p>' + cz(u.hook) + "</p></div>";
    if (u.steps) h += '<div class="blk"><p class="lab">푸는 순서</p>' + stepsHTML(u.steps) + "</div>";
    if (u.example) h += '<div class="blk ex"><p class="lab">풀이 예 (따라 읽기)</p><p class="exq">' + cz(u.example.q).replace(/class="cz"/g, 'class="cz on"') + "</p>" + stepsHTML(u.example.steps || []).replace(/class="cz"/g, 'class="cz on"') + '<p class="exa">답: <b>' + u.example.a + "</b></p></div>";
    if (learnStage) return h + '<div class="blk go"><button type="button" class="big" data-act="go">이해했으면 떠올리기 시작</button><p class="note">누르면 핵심이 가려지고 빈칸 풀이와 떠올리기 카드가 나옵니다.</p></div></section>';
    if (u.faded) h += '<div class="blk fd"><p class="lab">빈칸 풀이 (가린 칸을 먼저 채워 보기)</p><p class="exq">' + u.faded.q + "</p>" + stepsHTML(u.faded.steps || []) + '<p class="exa">답: <span class="cz" role="button" tabindex="0">' + u.faded.a + "</span></p></div>";
    var cs = (u.cards || []).map(function (c, i) { return { key: u.id + ":" + i, card: c, chunk: u }; });
    if (cs.length) h += '<div class="blk cards"><p class="lab">떠올리기 카드 ' + cs.length + "장</p>" + cs.map(function (x) { return cardHTML(x); }).join("") + "</div>";
    return h + '<div class="blk back"><button type="button" class="mini" data-act="back">배우기 단계로 돌아가기</button></div></section>';
  }

  function chapterHTML(k) {
    var c = RC[k], list = cardsOf(k);
    var h = '<header class="chap"><h1>' + c.title + '</h1><p class="goal">' + (c.goal || "") + '</p><p class="prog">카드 알았다 <b>' + known(list) + " / " + list.length + "</b> · 덩어리 " + c.chunks.length + "개</p>";
    h += '<nav class="toc">' + c.chunks.map(function (u, i) { return '<a href="#u-' + u.id + '">' + (i + 1) + ". " + u.title + "</a>"; }).join("") + "</nav>";
    h += '<p class="tip">처음이면 덩어리마다 <b>1 배우기</b>: 설명 → 핵심 정리 → 풀이 예를 차례로 읽고 [이해했으면 떠올리기 시작]. <b>2 떠올리기</b>: 핵심의 <span class="cz demo">가린 칸</span>을 떠올려 탭으로 확인 → 빈칸 풀이 → 카드 알았다/몰랐다. 몰랐던 카드는 「다시 볼 카드」에 모입니다.</p></header>';
    h += c.chunks.map(function (u, i) { return chunkHTML(u, i + 1); }).join("");
    h += '<section class="chunk mix" id="mix"><h2>섞어 떠올리기</h2><p class="why">이 장과 앞 장 카드를 섞어 다시 떠올립니다. 몰랐던 카드와 아직 안 본 카드가 먼저 나옵니다.</p><button type="button" class="big" data-act="mix" data-ch="' + k + '">섞어서 8장 뽑기</button><div class="mixbox"></div></section>';
    return h;
  }
  function finalHTML() {
    var f = RC.final; if (!f) return "<p>준비 중입니다.</p>";
    return '<header class="chap"><h1>' + f.title + '</h1><p class="goal">가린 칸을 먼저 떠올리고 탭해서 확인하세요. 시험 날 아침에 이것만 한 번 더.</p></header>' +
      f.sections.map(function (s, fi) {
        return '<section class="chunk" id="f-' + fi + '"><div class="blk core"><p class="lab">' + s.title + ' <button type="button" class="mini" data-act="show">다 보기</button><button type="button" class="mini" data-act="hide">다시 가리기</button></p><ul>' +
          s.lines.map(function (l) { return "<li>" + cz(l) + "</li>"; }).join("") + "</ul></div></section>";
      }).join("");
  }
  function reviewHTML() {
    var w = wrongs();
    var h = '<header class="chap"><h1>다시 볼 카드</h1><p class="goal">[몰랐다]를 누른 카드가 모입니다. 다시 떠올려 [알았다]를 누르면 빠집니다.</p><p class="prog">남은 카드 <b>' + w.length + "장</b></p></header>";
    if (!w.length) return h + '<p class="empty">아직 없습니다.</p>';
    return h + '<section class="chunk"><div class="blk cards">' + shuffle(w.slice()).map(function (x) { return cardHTML(x, RC[x.ch].title.split(" · ")[0] + " · " + x.chunk.title); }).join("") + "</div></section>";
  }

  // 탭
  var TABS = CH.map(function (k) { return { id: k, name: RC[k].title.split(" · ")[0] }; });
  if (RC.final) TABS.push({ id: "final", name: "전날 한 장" });
  TABS.push({ id: "review", name: "다시 볼 카드" });
  var cur = st.tab && TABS.some(function (t) { return t.id === st.tab; }) ? st.tab : TABS[0].id;
  function paintTabs() {
    $("rcTabs").innerHTML = TABS.map(function (t) {
      var n = t.id === "review" ? wrongs().length : 0;
      return '<button type="button" data-tab="' + t.id + '" aria-pressed="' + (t.id === cur) + '">' + t.name + (n ? ' <span class="badge">' + n + "</span>" : "") + "</button>";
    }).join("");
  }
  // 가로 아이패드용 왼쪽 목록: 장 제목, 진행, 덩어리별 알았다 수
  function paintSide() {
    var s = $("rcSide"); if (!s) return;
    if (cur === "final" || cur === "review") {
      var t = cur === "final" ? (RC.final || {}).title : "다시 볼 카드";
      s.innerHTML = '<p class="s-h">' + (cur === "final" ? "시험 날 아침" : "몰랐던 카드") + '</p><p class="s-t">' + t + "</p>" +
        (cur === "final" && RC.final ? RC.final.sections.map(function (x, i) { return '<a href="#f-' + i + '"><span class="n">' + (i + 1) + "</span>" + x.title + "</a>"; }).join("") : '<p class="s-p">남은 카드 ' + wrongs().length + "장</p>");
      return;
    }
    var c = RC[cur], list = cardsOf(cur);
    s.innerHTML = '<p class="s-h">' + c.title.split(" · ")[0] + '</p><p class="s-t">' + (c.title.split(" · ")[1] || "") + '</p><p class="s-p">카드 알았다 <b>' + known(list) + " / " + list.length + "</b></p>" +
      c.chunks.map(function (u, i) {
        var cs = (u.cards || []).map(function (x, j) { return u.id + ":" + j; }), ok = cs.filter(function (k) { return st.c[k] === "o"; }).length;
        return '<a href="#u-' + u.id + '"><span class="n">' + (i + 1) + "</span>" + u.title + (st.s[u.id] === "r" ? '<span class="k' + (cs.length && ok === cs.length ? " done" : "") + '">' + ok + "/" + cs.length + "</span>" : '<span class="k">배우기</span>') + "</a>";
      }).join("") + '<a href="#mix"><span class="n">+</span>섞어 떠올리기</a>';
  }
  function render() {
    paintTabs();
    view.innerHTML = cur === "final" ? finalHTML() : cur === "review" ? reviewHTML() : chapterHTML(cur);
    paintSide();
    var top = document.querySelector(".top"); if (top) document.documentElement.style.setProperty("--side-top", top.offsetHeight + "px");
    document.documentElement.classList.toggle("hide", !!st.hide);
    $("rcHide").textContent = st.hide ? "가리기: 켜짐" : "가리기: 꺼짐";
  }
  $("rcTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]"); if (!b) return;
    cur = b.dataset.tab; st.tab = cur; save(); render(); window.scrollTo(0, 0);
  });
  $("rcHide").addEventListener("click", function () { st.hide = !st.hide; save(); render(); });

  // 본문 클릭: 가림 칸, 다 보기/다시 가리기, 카드 보기·채점, 섞기
  view.addEventListener("click", function (e) {
    var z = e.target.closest(".cz");
    if (z && !z.classList.contains("demo")) { z.classList.toggle("on"); return; }
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.act === "show" || b.dataset.act === "hide") {
      Array.prototype.forEach.call(b.closest(".blk").querySelectorAll(".cz"), function (x) { x.classList.toggle("on", b.dataset.act === "show"); });
      return;
    }
    if (b.classList.contains("reveal")) { var cq = b.closest(".card-q"); cq.querySelector(".ca").hidden = false; b.hidden = true; return; }
    if (b.dataset.g) {
      var c = b.closest(".card-q"), k = c.dataset.key;
      st.c[k] = b.dataset.g; save();
      c.classList.toggle("is-o", b.dataset.g === "o"); c.classList.toggle("is-x", b.dataset.g === "x");
      c.querySelector(".mark").textContent = b.dataset.g === "o" ? "알았다" : "다시 볼 카드";
      c.querySelector(".ca").hidden = true; c.querySelector(".reveal").hidden = false;
      paintTabs(); paintSide();
      var pr = view.querySelector(".prog b");
      if (pr && cur !== "review" && cur !== "final") { var l = cardsOf(cur); pr.textContent = known(l) + " / " + l.length; }
      return;
    }
    if (b.dataset.act === "go" || b.dataset.act === "back") {
      var sec = b.closest(".chunk"), id = sec.dataset.u, n = sec.querySelector(".ch-n").textContent;
      if (b.dataset.act === "go") st.s[id] = "r"; else delete st.s[id];
      save();
      var u = null; CH.forEach(function (k) { RC[k].chunks.forEach(function (x) { if (x.id === id) u = x; }); });
      sec.outerHTML = chunkHTML(u, n); paintSide();
      var ns = document.getElementById("u-" + id); if (ns) ns.scrollIntoView({ block: "start" });
      return;
    }
    if (b.dataset.act === "mix") {
      var upto = CH.indexOf(b.dataset.ch), pool = ALL.filter(function (x) { return CH.indexOf(x.ch) <= upto; });
      var pri = function (x) { var s = st.c[x.key]; return s === "x" ? 0 : !s ? 1 : 2; };
      var pick = shuffle(pool.slice()).sort(function (a, b2) { return pri(a) - pri(b2); }).slice(0, 8);
      b.closest(".mix").querySelector(".mixbox").innerHTML = shuffle(pick).map(function (x) { return cardHTML(x, RC[x.ch].title.split(" · ")[0] + " · " + x.chunk.title); }).join("");
      b.textContent = "다시 섞어서 8장";
    }
  });
  view.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("cz")) { e.preventDefault(); e.target.classList.toggle("on"); } });

  // 화면 밝기 (암기 퀴즈와 같은 설정을 쓴다)
  var TK = "cr_quiz_theme", TH = ["", "dark", "light"], TN = { "": "화면: 자동", dark: "화면: 어둡게", light: "화면: 밝게" }, tc = "";
  try { tc = localStorage.getItem(TK) || ""; } catch (e) {}
  function theme() { if (tc) document.documentElement.dataset.theme = tc; else delete document.documentElement.dataset.theme; $("rcTheme").textContent = TN[tc]; }
  $("rcTheme").addEventListener("click", function () { tc = TH[(TH.indexOf(tc) + 1) % 3]; try { localStorage.setItem(TK, tc); } catch (e) {} theme(); });
  theme(); render();
})();
</script>
