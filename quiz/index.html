<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="암기 퀴즈">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>컴구 암기 퀴즈</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2130; --fg2:#566074; --line:#dfe3ea;
  --accent:#2b5f8e; --accent-fg:#ffffff; --accent-soft:#e7eef6;
  --easy:#2f6a52; --easy-soft:#e8f3ee; --trap:#a2412f; --trap-soft:#fbede9;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --surface:#181c22; --fg:#e4e7ec; --fg2:#98a1b0; --line:#2a3039;
    --accent:#8fb6dd; --accent-fg:#101318; --accent-soft:#1d2a38;
    --easy:#8fcfb0; --easy-soft:#16261f; --trap:#efa08f; --trap-soft:#301d19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c22; --fg:#e4e7ec; --fg2:#98a1b0; --line:#2a3039;
  --accent:#8fb6dd; --accent-fg:#101318; --accent-soft:#1d2a38;
  --easy:#8fcfb0; --easy-soft:#16261f; --trap:#efa08f; --trap-soft:#301d19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-ligatures:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
sup{font-size:.7em;line-height:0}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em}
[hidden]{display:none!important}

/* 화면 전체 = 세로 한 장 (iPhone 17 Pro 402 × 874 pt 기준, 안전 영역 포함) */
#qz{min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 30px) 18px calc(var(--sab) + 14px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:40px;padding:0 12px;font-size:14px;color:var(--fg2);cursor:pointer}

/* 시작 화면 */
#qzSetup{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.best-k{font-size:13px;color:var(--fg2);margin:0 0 4px}
.best-v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums}
.best-s{font-size:14px;color:var(--fg2);margin:4px 0 0}
details.cats>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;min-height:28px}
details.cats>summary::-webkit-details-marker{display:none}
details.cats>summary::after{content:"펼치기";font-size:13px;color:var(--fg2);font-weight:400}
details.cats[open]>summary::after{content:"접기"}
.qz-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qz-cats button{font-size:14px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg2);cursor:pointer}
.qz-cats button small{opacity:.7;margin-left:2px}
.qz-cats button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td{padding:7px 2px;border-top:1px solid var(--line)}
.hist tr:first-child td{border-top:0}
.hist td:nth-child(3),.hist td:nth-child(4){text-align:right;white-space:nowrap}
.hist td:nth-child(2){color:var(--fg2);font-size:13px}
.spacer{flex:1}
.deckrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.deckrow .best-s{margin:0}
.deckrow .ghost{flex:none;min-height:36px;font-size:13px}
.qz-btn{display:block;width:100%;min-height:58px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);font-size:18px;font-weight:700;cursor:pointer}
.qz-btn.sub{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:600;font-size:16px;min-height:52px}
.note{font-size:13px;color:var(--fg2);margin:0}

/* 문제 화면: 위 = 상태, 가운데 = 질문, 아래(엄지 닿는 곳) = 보기 */
#qzPlay{flex:1;display:flex;flex-direction:column;padding-top:4px}
.qz-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-variant-numeric:tabular-nums;color:var(--fg2);font-size:15px}
.qz-bar #qzScore{text-align:right}
.qz-time{font-size:24px;font-weight:800;color:var(--fg);text-align:center}
.qz-prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 0}
.qz-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.qarea{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 2px;min-height:150px}
.qz-cat{font-size:13px;color:var(--fg2);margin:0 0 8px}
.qz-q{font-size:22px;font-weight:700;line-height:1.45;margin:0;letter-spacing:-.01em;word-break:keep-all}
.qz-opts{display:flex;flex-direction:column;gap:10px}
.qz-opts button{text-align:left;font-size:17px;line-height:1.4;min-height:62px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:center;word-break:keep-all}
.qz-opts button:active{transform:scale(.985)}
.qz-opts button .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--fg2)}
.qz-opts button.ok{border-color:var(--easy);background:var(--easy-soft)}
.qz-opts button.no{border-color:var(--trap);background:var(--trap-soft)}
.qz-opts button:disabled{cursor:default}
.qz-fb{margin-top:10px;border-radius:14px;font-size:15px;line-height:1.55;overflow:hidden;border:1px solid var(--line)}
.qz-fb .pick{padding:10px 14px;background:var(--trap-soft)}
.qz-fb .right{padding:10px 14px;background:var(--easy-soft)}
.qz-wrong .m{color:var(--trap)}
.qz-row{display:flex;gap:10px;margin-top:10px}
.qz-row .qz-btn{flex:1}
.qz-row .qz-btn.sub{flex:0 0 34%}

/* 결과 화면 */
#qzEnd{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.qz-res-big{font-size:40px;font-weight:800;margin:.1em 0 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qz-new{color:var(--easy);font-weight:700;margin:0}
#qzEnd h3{font-size:16px;margin:6px 0 0}
.qz-wrong{margin:0;padding-left:1.3em}
.qz-wrong li{margin:.6em 0;line-height:1.5}
.qz-wrong .a{color:var(--easy);font-weight:700}
#qzEnd .qz-row{flex-direction:column;margin-top:auto}
#qzEnd .qz-row .qz-btn.sub{flex:none}
</style>
</head>
<body>
<div id="qz">
  <div class="top"><h1 id="qzTitle">컴구 암기 퀴즈</h1><button type="button" class="ghost" id="qzTheme">화면</button></div>

  <div id="qzSetup">
    <div class="card">
      <p class="best-k">최고 기록 <span id="qzMode"></span></p>
      <p class="best-v" id="qzBestV">아직 없음</p>
      <p class="best-s" id="qzBest"></p>
      <div class="deckrow"><p class="best-s" id="qzDeck"></p><button type="button" class="ghost" id="qzReset">진행 초기화</button></div>
    </div>
    <details class="cats card"><summary><span>범위 고르기 <span id="qzSelN"></span></span></summary>
      <div class="qz-cats" id="qzCats"></div>
      <p class="note" style="margin-top:10px">아무것도 안 고르면 전체. 기록은 범위 조합마다 따로 저장됩니다.</p>
    </details>
    <div class="card"><p class="best-k">최근 기록</p><table class="hist"><tbody id="qzHist"><tr><td>아직 기록이 없습니다.</td></tr></tbody></table></div>
    <div class="spacer"></div>
    <p class="note">20문제 · 맞히면 바로 다음 · 틀리면 정답 확인 후 [다음] (시간은 계속 흐름)</p>
    <button type="button" class="qz-btn" id="qzStart">시작</button>
  </div>

  <div id="qzPlay" hidden>
    <div class="qz-bar"><span id="qzCount">1 / 20</span><span class="qz-time" id="qzTime">0.0초</span><span id="qzScore">맞힌 수 0</span></div>
    <div class="qz-prog"><i id="qzProg"></i></div>
    <div class="qarea"><p class="qz-cat" id="qzCat"></p><p class="qz-q" id="qzQ"></p></div>
    <div class="qz-opts" id="qzOpts"></div>
    <div class="qz-fb" id="qzFb" hidden></div>
    <div class="qz-row" id="qzNextRow" hidden><button type="button" class="qz-btn sub" id="qzQuit">그만</button><button type="button" class="qz-btn" id="qzNext">다음</button></div>
  </div>

  <div id="qzEnd" hidden></div>
</div>
<script>
/* 퀴즈 오답 설명 0~65번 */
(window.QZN = window.QZN || {});
Object.assign(window.QZN, {
  0: ["<code>add x7, x5, x6</code>의 뜻. 결과 칸은 맨 앞 x5다.", "<code>sub x5, x6, x7</code>의 뜻(빼기).", "<code>add x6, x5, x7</code>의 뜻. 결과 칸은 맨 앞 x5다."],
  1: ["<code>sub x5, x7, x6</code>의 뜻. 빼는 순서를 뒤집었다.", "<code>sub x7, x5, x6</code>의 뜻. 결과 칸은 맨 앞 x5다.", "<code>add x5, x6, x7</code>의 뜻(더하기)."],
  2: ["x6 + 3과 같으니 <code>addi x5, x6, 3</code>의 뜻. addi는 상수를 더하기만 한다.", "<code>add x5, x6, x3</code>의 뜻. i가 붙으면 마지막은 레지스터가 아닌 상수다.", "<code>addi x6, x5, -3</code>의 뜻. 결과 칸은 맨 앞 x5다."],
  3: ["<code>sw x9, 32(x22)</code>의 뜻(메모리에 쓰기). lw는 반대로 읽는다.", "<code>addi x9, x22, 32</code>의 뜻(주소 계산만). lw는 그 주소의 값을 읽는다.", "<code>lw x22, 32(x9)</code>의 뜻. 주소 기준은 괄호 안 x22다."],
  4: ["<code>lw x9, 48(x22)</code>의 뜻(메모리에서 읽기). sw는 반대로 쓴다.", "<code>addi x9, x22, 48</code>의 뜻. sw는 x9를 바꾸지 않는다.", "<code>sw x22, 48(x9)</code>의 뜻. 쓸 값과 주소 기준이 바뀌었다."],
  5: ["<code>add x9, x10, x11</code>의 뜻(더하기).", "그런 명령어는 없다. 한 비트끼리라면 AND가 작은 쪽과 같아 헷갈린 것.", "<code>and x10, x9, x11</code>의 뜻. 결과 칸은 맨 앞 x9다."],
  6: ["그런 명령어는 없다. 한 비트끼리라면 OR가 큰 쪽과 같아 헷갈린 것.", "<code>add x9, x10, x11</code>의 뜻. 1이 겹치면 올림이 생겨 OR와 다르다.", "<code>xor x9, x10, x11</code>의 뜻(다르면 1). OR는 둘 다 1이어도 1이다."],
  7: ["<code>sub x9, x10, x11</code>의 뜻(빼기).", "<code>or x9, x10, x11</code>의 뜻. 둘 다 1이면 OR는 1, XOR는 0이다.", "<code>xori x9, x10, -1</code>의 뜻(NOT). xor는 두 레지스터를 비트마다 비교한다."],
  8: ["<code>addi x9, x10, -1</code>의 뜻(1 빼기).", "<code>sub x9, x0, x10</code>의 뜻(부호 반전). −x10은 NOT 결과 + 1이다.", "<code>xori x9, x10, 0</code>의 뜻. 0과 xor하면 그대로, 1과 하면 뒤집힌다."],
  9: ["<code>ori x9, x10, 0xFF</code>의 뜻. 1과 or하면 그 비트가 1이 된다.", "<code>addi x9, x10, 255</code>의 뜻(0xFF = 255를 더하기).", "위 8비트를 남기려면 0xFF000000과 and해야 한다. 0xFF는 아래 8비트다."],
  10: ["<code>slli x10, x22, 1</code>의 뜻. 2칸은 2<sup>2</sup> = 4배다.", "<code>addi x10, x22, 2</code>의 뜻(2 더하기).", "<code>srli x10, x22, 2</code>의 뜻. 오른쪽으로 밀어야 ÷ 4다."],
  11: ["<code>srai x9, x9, 8</code>의 뜻(산술 시프트). srl은 빈칸이 항상 0이다.", "<code>slli x9, x9, 8</code>의 뜻(× 2<sup>8</sup> = × 256).", "<code>addi x9, x9, -8</code>의 뜻. 8은 빼는 값이 아니라 밀 칸 수다."],
  12: ["<code>srli x9, x9, 4</code>의 뜻(논리 시프트). sra는 MSB로 채운다.", "<code>slli x9, x9, 4</code>의 뜻(× 2<sup>4</sup> = × 16).", "4칸은 ÷ 2<sup>4</sup> = ÷ 16이다. ÷ 4는 2칸(<code>srai x9, x9, 2</code>)."],
  13: ["<code>slli x5, x6, 7</code>의 뜻. i가 없으면 숫자 7이 아니라 x7에 든 값이다.", "<code>sll x5, x7, x6</code>의 뜻. 미는 대상과 칸 수가 바뀌었다.", "<code>sll x7, x5, x6</code>의 뜻. 결과 칸은 맨 앞 x5다."],
  14: ["<code>bne x5, x6, L</code>의 뜻(다르면 분기).", "그런 명령어는 없다. 분기는 비교만 하고 레지스터 값을 바꾸지 않는다.", "<code>beq x0, x0, L</code>(또는 <code>jal x0, L</code>)의 뜻. 조건 없는 점프다."],
  15: ["<code>beq x5, x6, L</code>의 뜻(같으면 분기).", "<code>blt x5, x6, L</code>의 뜻(작으면 분기, 부호 있게).", "그런 명령어는 없다. 분기는 비교만 하고 x5를 바꾸지 않는다."],
  16: ["<code>blt x6, x5, L</code>의 뜻(순서를 바꾼 것). '크면 분기' 명령은 따로 없다.", "<code>bltu x5, x6, L</code>의 뜻. u가 붙어야 무부호다.", "<code>bge x6, x5, L</code>의 뜻(x6 ≥ x5는 x5 ≤ x6과 같다)."],
  17: ["<code>blt x6, x5, L</code>의 뜻(x5 > x6). bge는 같을 때도 분기한다.", "<code>bge x6, x5, L</code>의 뜻(두 레지스터 순서를 바꾼 것).", "<code>bgeu x5, x6, L</code>의 뜻. u가 붙어야 무부호다."],
  18: ["<code>blt x5, x6, L</code>의 뜻. u가 없으면 부호 있게 비교한다.", "<code>bgeu x5, x6, L</code>의 뜻(크거나 같으면 분기).", "<code>beq x5, x6, L</code>의 뜻(같으면 분기)."],
  19: ["끝에 붙은 u의 뜻(bltu처럼 unsigned).", "이름 앞 l(load)의 뜻. lw처럼 메모리에서 읽는다.", "그런 뜻의 접미사는 없다. i는 immediate(즉시값)다."],
  20: ["끝에 붙은 i의 뜻(addi처럼 immediate).", "lui의 u(upper)와 헷갈린 것. bltu의 u는 unsigned다.", "sw의 s(store)의 뜻. 메모리에 쓰기는 sw·sb 같은 명령이다."],
  21: ["0과 and하면 결과는 항상 0이다(모든 비트 지우기).", "모든 비트가 1인 값과 or하면 결과는 항상 모두 1(−1)이다.", "0 − x는 부호 반전(−x)이다. NOT x보다 1 크다."],
  22: ["속도에 1000을 곱한 값일 뿐 주기가 아니다. 주기는 1 ÷ 속도.", "단위 바꾸기 식이다(MHz 숫자 ÷ 1000 = GHz 숫자).", "지나간 사이클 수를 구하는 식이다."],
  23: ["시간 ÷ 클럭 주기라면 맞다. 속도는 곱해야 사이클 수.", "뜻 없는 값이다. 사이클 수는 시간 × 클럭 속도.", "시간 ÷ 클럭 주기가 사이클 수다. 주기는 곱하지 않고 나눈다."],
  24: ["사이클 수 × 클럭 주기라면 시간이다. 속도는 나눠야 한다.", "시간의 역수(1 ÷ 시간)가 나온다. 거꾸로 나눴다.", "단위가 다른 두 값을 빼서 뜻이 없다. 나눠야 한다."],
  25: ["사이클 수 ÷ 클럭 속도라면 맞다. 주기는 곱한다.", "뜻 없는 값이다. 한 번 시간(주기) × 횟수가 시간.", "개수와 시간을 더해 뜻이 없다. 곱해야 한다."],
  26: ["클럭 주기(초 단위)의 뜻이다. Hz는 그 역수.", "bps(bit per second)의 뜻이다. Hz는 횟수만 센다.", "기준이 1초다. 1 ns에 1번이면 1 GHz다."],
  27: ["1 ps는 1 THz(10<sup>12</sup> Hz)의 주기.", "1 µs는 1 MHz의 주기.", "1 ms는 1 kHz의 주기."],
  28: ["4 ns는 250 MHz의 주기.", "25 ps는 40 GHz의 주기. 0을 하나 빠뜨린 값.", "2.5 ns는 400 MHz의 주기. 1 ÷ 4 = 0.25 ns다."],
  29: ["2 ns는 500 MHz의 주기.", "50 ps는 20 GHz의 주기. 0을 하나 빠뜨린 값.", "0.2 ns는 5 GHz의 주기. 1 ÷ 2 = 0.5 ns다."],
  30: ["500 ns는 2 MHz의 주기.", "0.5 ns는 2 GHz의 주기.", "2 µs는 500 kHz의 주기."],
  31: ["250 MHz의 주기는 4 ns다. 숫자를 그대로 옮긴 값.", "2.5 GHz의 주기는 400 ps다.", "400 MHz의 주기는 2.5 ns다."],
  32: ["GHz 숫자 × 1000은 MHz 숫자(속도)다. 주기가 아니다.", "GHz 숫자 ÷ 1000은 THz 숫자(속도)다.", "1 ÷ (GHz 숫자)는 ns 단위 주기다. ps면 1000배."],

  103: ["소수점에서 가장 먼 자리는 마지막에 나온 숫자가 놓이는 곳.", "정수 부분(÷2)에서만 맞다. 소수 부분은 소수점 바로 오른쪽.", "소수 부분(×2)에서만 맞다. 정수 부분은 소수점 바로 왼쪽."],

  105: ["15는 한 바퀴(16)에 1 모자란다. 15는 뒤집기(15 − 숫자)에 쓰는 수.", "10을 더하는 것은 10진 뺄셈에서 빌려 올 때.", "앞자리 1을 그대로 옮긴 것. 앞자리 1은 이 자리에서 16이다."],
  106: ["왼쪽부터 묶어도 되는 것은 비트 수가 4의 배수일 때뿐.", "3비트씩 묶는 것은 8진수 변환.", "8비트씩 묶으면 1바이트 = 16진 두 자리."],
  107: ["16을 곱하고 정수 부분을 위 → 아래로는 10진 소수 부분 → 16진.", "2로 나눠 4비트씩 묶는 것도 되지만 유일한 방법은 아니다.", "10으로 나누는 것은 10진 숫자를 한 자리씩 떼어 낼 때."],
  108: ["2를 쓰는 것은 10진 덧셈. 2진 한 자리엔 0과 1뿐이다.", "1은 1 + 0 또는 0 + 1의 결과.", "0을 쓰고 올리지 않는 것은 0 + 0의 결과."],
  109: ["0을 쓰고 1을 올리는 것은 1 + 1(1이 둘)일 때.", "3을 쓰는 것은 10진 덧셈. 3 = 11₂.", "1을 쓰고 올리지 않는 것은 1이 하나일 때(1 + 0 + 0)."],

  113: ["−5는 0xFFFFFFFB.", "−10은 0xFFFFFFF6. A(10)에 −만 붙인 값이다.", "−250은 0xFFFFFF06. 꼬리 FA(250)에 −만 붙인 값이다."],
  114: ["−255는 0xFFFFFF01.", "−16은 0xFFFFFFF0.", "256은 0x00000100. 0xFFFFFF00은 MSB가 1이라 음수다."],
  115: ["−1은 같은 패턴을 부호 있게 읽은 값.", "2<sup>32</sup>는 0x1_0000_0000. 33비트가 필요하다.", "2<sup>31</sup> − 1은 0x7FFFFFFF. 부호 있는 32비트 최댓값."],
  116: ["x는 양수 x의 패턴을 읽은 값. −x는 다른 패턴이다.", "2<sup>n</sup> + x는 n비트로 담을 수 없는 큰 값.", "8비트 −37이면 128 − 37 = 91. 실제 219와 다르다."],
  117: ["양수는 MSB가 0일 때(0 제외).", "0은 모든 비트가 0일 때. MSB도 0이다.", "오버플로는 연산 결과가 범위를 넘을 때의 말. 수 하나의 성질이 아니다."],
  118: ["0~7로 시작하면 MSB가 0이라 0 또는 양수.", "F로 시작하면 음수가 맞지만 8~E로 시작해도 음수다.", "8(1000)과 9(1001)도 1로 시작해 음수다."],
  119: ["−127~127은 부호-크기나 1의 보수 8비트 범위.", "128은 1000 0000인데 이 패턴은 −128이다. 9비트가 필요.", "0~255는 8비트 무부호 범위."],
  120: ["−128~127은 8비트 부호 있는 범위.", "256은 1 0000 0000으로 9비트가 필요하다.", "1~256은 개수(256개)를 1부터 센 것. 0이 빠졌다."],

  122: ["항상 0으로 채우는 것은 0 확장(무부호). MSB가 0일 때만 같다.", "1로 채우는 것은 MSB가 1일 때만 맞다.", "16진 숫자가 아니라 비트 하나로 채운다. 7F0을 7로 채우면 틀린다."],
  123: ["0x00000FE8은 0으로 채운 것. MSB가 0일 때의 부호 확장.", "FE8 자리마다 16 − 숫자(1, 2, 8)를 한 것. 꼬리는 그대로 둔다.", "맨 앞 한 자리만 F. 늘어난 칸 전부(FFFFF)를 채워야 한다."],
  124: ["0xFFFFF7F0은 F로 채운 것. MSB가 1일 때의 방식(값 −2064).", "0xFFFFF810은 −0x7F0(−2032). 부호를 바꾼 값이다.", "0x7F000000은 0x7F0을 20비트 왼쪽으로 민 값."],
  125: ["16 − 숫자는 뒤집기에 1을 더한 것. +1은 끝에 한 번만.", "숫자 − 15는 15 − 숫자의 부호를 바꾼 것. 0이나 음수가 나온다.", "숫자 + 1은 다음 수로 세기. 뒤집기와 다르다."],

    ["imm", "immediate", "명령어 안에 적힌 상수(즉시값)", "reg"], ["레지스터", "register", "CPU 안의 저장 칸 x0~x31(각 32비트)", "reg"],
    ["오프셋", "offset", "시작 주소에서 떨어진 바이트 수", "mem"], ["주소", "address", "메모리 칸(바이트)마다 붙은 번호", "mem"], ["인덱스", "index", "배열에서 몇 번째 원소인지(0부터)", "mem"],
    ["라벨", "label", "명령어 위치의 이름(분기 목적지)", "mem"], ["주석", "comment", "// 뒤의 설명, 실행되지 않음", "mem"], ["배열", "array", "같은 종류 값을 메모리에 차례로 붙여 놓은 것", "mem"],
    ["부호 있는", "signed", "음수도 있는 수로 읽기(2의 보수)", "sign"], ["부호 없는", "unsigned", "0 이상의 수로만 읽기", "sign"], ["2의 보수", "two's complement", "뒤집고 +1 해서 음수를 나타내는 방식", "sign"],
    ["부호 확장", "sign extension", "칸을 늘릴 때 늘어난 칸을 MSB로 채우기", "sign"], ["논리 시프트", "logical shift", "빈칸을 0으로 채우는 시프트", "sign"], ["산술 시프트", "arithmetic shift", "빈칸을 MSB로 채우는 시프트", "sign"],
    ["마스크", "mask", "원하는 비트만 남기거나 켜도록 고르는 값", "sign"],
    ["분기", "branch", "조건에 따라 다른 줄로 건너뛰기", "code"], ["기계어", "machine code", "CPU가 실제로 읽는 0과 1(명령어 하나 32비트)", "code"], ["어셈블리어", "assembly language", "기계어를 사람이 읽게 글자로 쓴 것", "code"],
    ["명령어", "instruction", "CPU에게 시키는 일 하나", "code"],
    ["클럭 사이클", "clock cycle", "클럭이 한 번 똑딱이는 것", "clk"], ["클럭 주기", "clock period", "한 사이클에 걸리는 시간(예 250 ps)", "clk"], ["클럭 속도", "clock rate", "1초에 지나가는 사이클 수(예 4 GHz)", "clk"], ["헤르츠", "Hz (hertz)", "1초에 몇 번인가의 단위", "clk"]
  ];
  var GEN_NOTES = {};
  function pick3(list, i, label) { // 같은 그룹을 먼저, 모자라면 전체에서. 문제마다 늘 같은 보기가 나오게 순서를 고정한다.
    var same = [], other = [];
    list.forEach(function (x, j) { if (j !== i) (x[3] === list[i][3] ? same : other).push(j); });
    var rot = function (a) { return a.slice(i % (a.length || 1)).concat(a.slice(0, i % (a.length || 1))); };
    var out = rot(same).concat(rot(other)).slice(0, 3);
    return out;
  }
  INS.forEach(function (x, i) {
    if (x[0] === x[1]) return; // add·and·or 처럼 이름이 곧 영어인 것은 답이 문제에 드러나서 뺀다
    var d = pick3(INS, i), ans = function (k) { return INS[k][1] + " · " + INS[k][2]; };
    GEN_NOTES[B.length] = d.map(function (k) { return "그건 " + INS[k][0] + "의 풀이."; });
    B.push([13, "<code>" + x[0] + "</code>의 영어 풀이와 뜻", ans(i), ans(d[0]), ans(d[1]), ans(d[2]), x[0] + " = " + x[1] + ". " + x[2] + "."]);
    if (x[1].indexOf(x[0]) === 0) return; // subtract → sub 처럼 영어가 이름으로 시작하면 역방향 문제는 답이 드러나서 뺀다
    GEN_NOTES[B.length] = d.map(function (k) { return INS[k][0] + "는 " + INS[k][1] + "(" + INS[k][2] + ")."; });
    B.push([13, "'" + x[1] + "'(" + x[2] + ")인 명령어", "<code>" + x[0] + "</code>", "<code>" + INS[d[0]][0] + "</code>", "<code>" + INS[d[1]][0] + "</code>", "<code>" + INS[d[2]][0] + "</code>", "이름의 글자가 영어 풀이의 첫 글자들이다."]);
  });
  // 약자(MSB, rd …)는 "영어 풀이 · 뜻"을 묻고, 한글로 소리만 옮긴 말(더블워드, 오프셋 …)은 영어가 답을 드러내므로 뜻만 묻는다
  var ABBR = { "MSB": 1, "LSB": 1, "KiB": 1, "rd": 1, "rs1": 1, "rs2": 1, "imm": 1 };
  TERMS.forEach(function (x, i) {
    var d = pick3(TERMS, i), ab = ABBR[x[0]];
    var ans = function (k) { return ab ? TERMS[k][1] + " · " + TERMS[k][2] : TERMS[k][2]; };
    GEN_NOTES[B.length] = d.map(function (k) { return "그건 " + TERMS[k][0] + "(" + TERMS[k][1] + ")의 뜻."; });
    B.push([14, ab ? "<b>" + x[0] + "</b>의 영어 풀이와 뜻" : "<b>" + x[0] + "</b>의 뜻", ans(i), ans(d[0]), ans(d[1]), ans(d[2]), x[0] + " = " + x[1] + ". " + x[2] + "."]);
  });

  B.forEach(function (q, i) { q.idx = i; });
  root.qzBank = B; // 점검용(읽기만)
  var NOTES = window.QZN || {}; // 오답 보기 설명: { 문제번호: [오답1 설명, 오답2 설명, 오답3 설명] }
  Object.keys(GEN_NOTES).forEach(function (k) { if (!NOTES[k]) NOTES[k] = GEN_NOTES[k]; });
  function noteOf(q, opt) { var k = [q[3], q[4], q[5]].indexOf(opt), n = q[7] || NOTES[q.idx]; return k >= 0 && n && n[k] ? n[k] : ""; }
  var KEY = "cr_quiz_v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  var data = load(); data.best = data.best || {}; data.hist = data.hist || []; data.sel = data.sel || [];
  data.deck = data.deck || {}; data.review = data.review || {}; data.lap = data.lap || {}; // 범위별 남은 덱, 복습 대기, 바퀴 수
  var BANK_V = 300; // 문제 번호 체계가 바뀌면 올린다. 바뀌면 덱·복습만 새로 시작(최고 기록은 유지)
  if (data.bankV !== BANK_V) { data.deck = {}; data.review = {}; data.lap = {}; data.known = {}; data.bankV = BANK_V; save(data); }
  function resetProgress(m) { delete data.deck[m]; delete data.review[m]; delete data.lap[m]; if (data.known) delete data.known[m]; save(data); }
  var REVIEW_MAX = 5; // 한 판에 섞는 복습 문제 최대 수
  var $ = function (id) { return document.getElementById(id); };
  var sel = data.sel.slice();
  function modeKey(s) { return s.length && s.length < CATS.length ? s.slice().sort(function (a, b) { return a - b; }).join(",") : "all"; }
  function modeName(s) { return s.length && s.length < CATS.length ? s.map(function (i) { return CATS[i]; }).join(", ") : "전체"; }
  function fmt(ms) { var t = ms / 1000; return t >= 60 ? Math.floor(t / 60) + "분 " + (t % 60).toFixed(1) + "초" : t.toFixed(1) + "초"; }
  function better(a, b) { return !b || a.score > b.score || (a.score === b.score && a.ms < b.ms); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // 범위 버튼
  var cats = $("qzCats");
  CATS.forEach(function (name, i) {
    var n = B.filter(function (q) { return q[0] === i; }).length;
    var b = document.createElement("button"); b.type = "button"; b.dataset.i = i;
    b.innerHTML = name + " <small>" + n + "</small>";
    b.addEventListener("click", function () {
      var k = sel.indexOf(i); if (k >= 0) sel.splice(k, 1); else sel.push(i);
      data.sel = sel; save(data); paintSetup();
    });
    cats.appendChild(b);
  });
  function paintSetup() {
    Array.prototype.forEach.call(cats.children, function (b) { b.setAttribute("aria-pressed", sel.indexOf(+b.dataset.i) >= 0 ? "true" : "false"); });
    var bst = data.best[modeKey(sel)];
    if ($("qzBestV")) {
      $("qzMode").textContent = "· " + modeName(sel);
      $("qzBestV").textContent = bst ? bst.score + " / 20 · " + fmt(bst.ms) : "아직 없음";
      $("qzBest").textContent = bst ? "이 기록을 넘어 보세요. 점수가 같으면 시간이 짧은 쪽이 이깁니다." : "첫 판을 풀면 여기에 목표가 생깁니다.";
      $("qzSelN").textContent = sel.length && sel.length < CATS.length ? "(" + sel.length + "개)" : "(전체)";
      var m = modeKey(sel), total = pool(sel).length, left = (data.deck[m] || []).length, rv = (data.review[m] || []).length;
      if (data.deck[m]) { var kn = {}; ((data.known || {})[m] || []).forEach(function (i) { kn[i] = 1; }); left += pool(sel).filter(function (q) { return !kn[q.idx]; }).length; }
      var seen = data.deck[m] ? total - left : 0, lap = data.lap[m] || 1;
      if ($("qzDeck")) $("qzDeck").textContent = lap + "바퀴째 " + seen + " / " + total + "문제 봄" + (rv ? " · 복습 대기 " + rv + "개" : "");
    } else $("qzBest").innerHTML = "범위: <b>" + modeName(sel) + "</b> · 최고 기록: " + (bst ? "<b>" + bst.score + " / 20 · " + fmt(bst.ms) + "</b>" : "아직 없음");
  }
  function paintHist() {
    var tb = $("qzHist");
    if (!data.hist.length) { tb.innerHTML = '<tr><td colspan="4">아직 기록이 없습니다.</td></tr>'; return; }
    tb.innerHTML = data.hist.slice(0, 10).map(function (h) {
      return "<tr><td>" + h.date + "</td><td>" + h.mode + "</td><td>" + h.score + " / " + h.n + "</td><td>" + fmt(h.ms) + "</td></tr>";
    }).join("");
  }

  // 한 판
  var round = null, timer = 0;
  function pool(s) { return B.filter(function (q) { return !s.length || s.indexOf(q[0]) >= 0; }); }
  // 덱 방식: 범위의 문제를 한 번 섞어 줄 세우고 판마다 앞에서 꺼낸다. 다 쓰면 다시 섞어 다음 바퀴.
  // 틀린 문제는 복습 대기에 넣어 다음 판에 최대 REVIEW_MAX개 섞는다(맞히면 빠짐).
  function draw(list) {
    var m = modeKey(sel), ids = list.map(function (q) { return q.idx; });
    var has = {}; ids.forEach(function (i) { has[i] = 1; });
    var deck = (data.deck[m] || []).filter(function (i) { return has[i]; });
    // 바퀴 도중에 새 문제가 추가됐으면 남은 덱의 무작위 자리에 끼워 이번 바퀴에 나오게 한다
    data.known = data.known || {};
    var known = {}; (data.known[m] || []).forEach(function (i) { known[i] = 1; });
    if (data.deck[m]) ids.forEach(function (i) { if (!known[i]) deck.splice(Math.floor(Math.random() * (deck.length + 1)), 0, i); });
    data.known[m] = ids.slice();
    var review = (data.review[m] || []).filter(function (i) { return has[i]; });
    var take = review.slice(0, REVIEW_MAX), inRound = {};
    take.forEach(function (i) { inRound[i] = 1; });
    var guard = 0;
    while (take.length < 20 && guard++ < 50) {
      if (!deck.length) { deck = shuffle(ids.slice()); data.lap[m] = (data.lap[m] || 0) + 1; }
      var i = deck.shift();
      if (inRound[i] && ids.length > 20) continue; // 이번 판에 이미 있으면 건너뜀(범위가 20개 이하면 중복 허용)
      take.push(i); inRound[i] = 1;
    }
    if (!data.lap[m]) data.lap[m] = 1;
    data.deck[m] = deck; data.review[m] = review; save(data);
    return shuffle(take.map(function (i) { return B[i]; }));
  }
  function start(list, retry) {
    var qs = retry ? shuffle(list.slice()) : draw(list);
    round = { qs: qs, i: 0, ok: 0, wrong: [], t0: performance.now(), retry: !!retry, mode: modeKey(sel), name: retry ? "틀린 문제 다시" : modeName(sel) };
    $("qzSetup").hidden = true; $("qzEnd").hidden = true; $("qzPlay").hidden = false; setTop(true); window.scrollTo(0, 0);
    clearInterval(timer); timer = setInterval(tick, 100); tick(); show();
  }
  function tick() { if (round) $("qzTime").textContent = fmt(performance.now() - round.t0); }
  function show() {
    var q = round.qs[round.i], n = round.qs.length;
    $("qzCount").textContent = (round.i + 1) + " / " + n;
    $("qzScore").textContent = "맞힌 수 " + round.ok;
    $("qzProg").style.width = (round.i / n * 100) + "%";
    $("qzCat").textContent = CATS[q[0]];
    $("qzQ").innerHTML = q[1];
    var opts = shuffle([q[2], q[3], q[4], q[5]]);
    var box = $("qzOpts"); box.innerHTML = "";
    opts.forEach(function (o, k) {
      var b = document.createElement("button"); b.type = "button";
      b.innerHTML = '<span class="k">' + (k + 1) + "</span><span>" + o + "</span>";
      b.dataset.right = o === q[2] ? "1" : ""; b.qzOpt = o;
      b.addEventListener("click", function () { pick(b); });
      box.appendChild(b);
    });
    $("qzFb").hidden = true; $("qzNextRow").hidden = true;
  }
  function pick(b) {
    if (!round || round.locked) return;
    round.locked = true;
    var q = round.qs[round.i], btns = $("qzOpts").querySelectorAll("button");
    Array.prototype.forEach.call(btns, function (x) { x.disabled = true; if (x.dataset.right) x.classList.add("ok"); });
    var rv = data.review[round.mode] = data.review[round.mode] || [], at = rv.indexOf(q.idx);
    if (b.dataset.right) { if (at >= 0) rv.splice(at, 1); } else if (at < 0) rv.push(q.idx);
    save(data);
    if (b.dataset.right) {
      round.ok++; $("qzScore").textContent = "맞힌 수 " + round.ok;
      setTimeout(next, 350);
    } else {
      b.classList.add("no");
      var mine = b.qzOpt, note = noteOf(q, mine);
      round.wrong.push({ q: q, mine: mine, note: note });
      var fb = $("qzFb"); fb.className = "qz-fb";
      fb.innerHTML = '<div class="pick">내가 고른 것: <b>' + mine + "</b>" + (note ? "<br>" + note : "") + "</div>" +
        '<div class="right">정답: <b>' + q[2] + "</b><br>" + q[6] + "</div>";
      fb.hidden = false;
      $("qzNextRow").hidden = false; $("qzNext").focus({ preventScroll: true });
    }
  }
  function next() {
    if (!round) return;
    round.locked = false; round.i++;
    if (round.i >= round.qs.length) finish(); else show();
  }
  function finish() {
    clearInterval(timer);
    var ms = performance.now() - round.t0, n = round.qs.length, r = round; round = null;
    var rec = { score: r.ok, n: n, ms: ms };
    var html = '<p class="qz-res-big">' + r.ok + " / " + n + " · " + fmt(ms) + "</p>";
    if (!r.retry && n === 20) {
      var prev = data.best[r.mode];
      if (better(rec, prev)) { data.best[r.mode] = { score: r.ok, ms: ms }; html += '<p class="qz-new">새 최고 기록!' + (prev ? " (이전 " + prev.score + " / 20 · " + fmt(prev.ms) + ")" : "") + "</p>"; }
      else html += "<p>최고 기록: " + prev.score + " / 20 · " + fmt(prev.ms) + (prev.score === r.ok ? " (시간 " + fmt(ms - prev.ms) + " 차이)" : " (점수 " + (prev.score - r.ok) + "개 차이)") + "</p>";
      var d = new Date();
      data.hist.unshift({ date: (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2), mode: r.name, score: r.ok, n: n, ms: ms });
      data.hist = data.hist.slice(0, 30); save(data);
    } else html += '<p class="note">틀린 문제 다시 풀기는 최고 기록에 넣지 않습니다.</p>';
    if (r.wrong.length) {
      html += "<h3>틀린 문제 " + r.wrong.length + "개</h3><ol class=\"qz-wrong\">" + r.wrong.map(function (w) {
        return "<li>" + w.q[1] + "<br><span class=\"m\">고른 것: " + w.mine + (w.note ? " → " + w.note : "") + "</span>" +
          "<br><span class=\"a\">정답: " + w.q[2] + "</span> · " + w.q[6] + "</li>";
      }).join("") + "</ol>";
    }
    html += '<div class="qz-row"><button type="button" class="qz-btn" id="qzAgain">다시 도전</button>' +
      (r.wrong.length ? '<button type="button" class="qz-btn sub" id="qzRetry">틀린 문제만 다시</button>' : "") +
      '<button type="button" class="qz-btn sub" id="qzHome">범위 바꾸기</button></div>';
    var end = $("qzEnd"); end.innerHTML = html; end.hidden = false; $("qzPlay").hidden = true;
    $("qzAgain").onclick = function () { start(pool(sel)); };
    if ($("qzRetry")) $("qzRetry").onclick = function () { start(r.wrong.map(function (w) { return w.q; }), true); };
    $("qzHome").onclick = function () { end.hidden = true; $("qzSetup").hidden = false; paintSetup(); setTop(false); };
    paintSetup(); paintHist();
    window.scrollTo(0, 0); setTop(false);
  }

  $("qzStart").addEventListener("click", function () { start(pool(sel)); });
  if ($("qzReset")) $("qzReset").addEventListener("click", function () {
    if (!confirm("범위 「" + modeName(sel) + "」의 바퀴 진행과 복습 대기를 처음부터 다시 시작할까요? (최고 기록과 최근 기록은 그대로입니다.)")) return;
    resetProgress(modeKey(sel)); paintSetup();
  });
  $("qzNext").addEventListener("click", next);
  $("qzQuit").addEventListener("click", function () { clearInterval(timer); round = null; $("qzPlay").hidden = true; $("qzSetup").hidden = false; paintSetup(); setTop(false); });
  document.addEventListener("keydown", function (e) {
    if (!round || $("qzPlay").hidden || e.target.closest && e.target.closest("input,textarea")) return;
    if (round.locked && (e.key === "Enter" || e.key === " ")) { if (!$("qzNextRow").hidden) { e.preventDefault(); next(); } return; }
    var k = +e.key; if (k >= 1 && k <= 4) { var b = $("qzOpts").children[k - 1]; if (b) { e.preventDefault(); pick(b); } }
  });
  // 다른 단원으로 가면 진행 중인 판은 멈춘다
  document.addEventListener("lesson:shown", function (e) { if (e.detail !== "kb6" && round) { clearInterval(timer); round = null; $("qzPlay").hidden = true; $("qzSetup").hidden = false; paintSetup(); } });
  var TK = "cr_quiz_theme", THEMES = ["", "dark", "light"], TN = { "": "화면: 자동", dark: "화면: 어둡게", light: "화면: 밝게" };
  function theme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; var b = $("qzTheme"); if (b && !round) b.textContent = TN[t]; }
  var cur = ""; try { cur = localStorage.getItem(TK) || ""; } catch (e) {}
  function setTop(play) { var b = $("qzTheme"); if (!b) return; b.textContent = play ? "그만" : TN[cur]; }
  if ($("qzTheme")) $("qzTheme").addEventListener("click", function () {
    if (round) { $("qzQuit").click(); return; }
    cur = THEMES[(THEMES.indexOf(cur) + 1) % 3]; try { localStorage.setItem(TK, cur); } catch (e) {} theme(cur);
  });
  theme(cur);
  paintSetup(); paintHist();
})();
</script>
